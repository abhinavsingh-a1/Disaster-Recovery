# One pipeline deploys BOTH regions from the same commit, then tests them.
# (The talk: never deploy from a laptop; keep primary and DR in sync.)
name: deploy

on:
  push:
    branches: [main]
  pull_request:

permissions:
  id-token: write
  contents: read

jobs:
  terraform:
    runs-on: ubuntu-latest
    env:
      TF_VAR_hosted_zone_name: ${{ vars.HOSTED_ZONE_NAME }}
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: us-east-1

      - run: terraform fmt -check -recursive
      - run: terraform init
      - run: terraform validate
      - run: terraform plan -out=tfplan

      - name: Apply (both regions)
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        run: terraform apply -auto-approve tfplan

      - name: Smoke test primary + DR
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        run: ./scripts/smoke-test.sh
