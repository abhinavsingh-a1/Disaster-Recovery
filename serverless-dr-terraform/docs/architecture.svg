<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" font-family="'Segoe UI', Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#2B3A55"/>
    </marker>
    <marker id="arrG" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1F7A5A"/>
    </marker>
    <marker id="arrO" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#B5651D"/>
    </marker>
  </defs>

  <rect width="1200" height="900" fill="#FFFFFF"/>

  <!-- Title -->
  <text x="40" y="48" font-size="26" font-weight="700" fill="#1B2436">Serverless multi-site active/active DR</text>
  <text x="40" y="74" font-size="15" fill="#56627A">Notes API deployed identically to two AWS regions; DynamoDB global table keeps data in sync; Route 53 routes by latency and health.</text>

  <!-- Users -->
  <rect x="520" y="100" width="160" height="54" rx="27" fill="#EEF2F8" stroke="#2B3A55" stroke-width="1.5"/>
  <text x="600" y="123" font-size="15" font-weight="600" fill="#1B2436" text-anchor="middle">Clients</text>
  <text x="600" y="142" font-size="12" fill="#56627A" text-anchor="middle">web / mobile / Postman</text>
  <line x1="600" y1="154" x2="600" y2="186" stroke="#2B3A55" stroke-width="1.8" marker-end="url(#arr)"/>
  <text x="612" y="176" font-size="12" fill="#56627A">https://api.example.com/notes</text>

  <!-- Route 53 -->
  <rect x="380" y="190" width="440" height="100" rx="10" fill="#F4F0FA" stroke="#6A4C93" stroke-width="1.8"/>
  <text x="600" y="215" font-size="17" font-weight="700" fill="#3E2A5C" text-anchor="middle">Amazon Route 53 (global)</text>
  <text x="600" y="237" font-size="13" fill="#3E2A5C" text-anchor="middle">2 × A-alias records, same name api.example.com</text>
  <text x="600" y="256" font-size="13" fill="#3E2A5C" text-anchor="middle">Latency routing policy · evaluate target health = true</text>
  <text x="600" y="275" font-size="13" fill="#3E2A5C" text-anchor="middle">HTTPS health checks on /dev/health per region</text>

  <!-- Route53 -> regions -->
  <path d="M470,290 L470,330 L300,330 L300,362" fill="none" stroke="#2B3A55" stroke-width="1.8" marker-end="url(#arr)"/>
  <path d="M730,290 L730,330 L900,330 L900,362" fill="none" stroke="#2B3A55" stroke-width="1.8" marker-end="url(#arr)"/>
  <text x="318" y="322" font-size="12" fill="#56627A">nearest / healthy</text>
  <text x="748" y="322" font-size="12" fill="#56627A">nearest / healthy</text>

  <!-- Region boxes -->
  <rect x="60" y="366" width="480" height="420" rx="12" fill="#F7F9FC" stroke="#2B3A55" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="80" y="394" font-size="16" font-weight="700" fill="#1B2436">Region A · us-east-1 (N. Virginia)</text>
  <text x="80" y="413" font-size="12" fill="#56627A">"primary" provider alias · serves live traffic</text>

  <rect x="660" y="366" width="480" height="420" rx="12" fill="#F7F9FC" stroke="#2B3A55" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="680" y="394" font-size="16" font-weight="700" fill="#1B2436">Region B · us-east-2 (Ohio)</text>
  <text x="680" y="413" font-size="12" fill="#56627A">"dr" provider alias · also serves live traffic</text>

  <!-- Region A stack -->
  <g>
    <rect x="100" y="430" width="400" height="58" rx="8" fill="#FFFFFF" stroke="#8A94A8"/>
    <text x="300" y="453" font-size="14" font-weight="600" fill="#1B2436" text-anchor="middle">Custom domain api.example.com (REGIONAL)</text>
    <text x="300" y="473" font-size="12" fill="#56627A" text-anchor="middle">ACM cert issued in us-east-1 · base path mapping → stage dev</text>
    <line x1="300" y1="488" x2="300" y2="508" stroke="#2B3A55" stroke-width="1.6" marker-end="url(#arr)"/>

    <rect x="100" y="510" width="400" height="52" rx="8" fill="#FFF6EC" stroke="#B5651D"/>
    <text x="300" y="532" font-size="14" font-weight="600" fill="#7A3F0C" text-anchor="middle">API Gateway REST API (REGIONAL endpoint)</text>
    <text x="300" y="550" font-size="12" fill="#7A3F0C" text-anchor="middle">POST /notes · GET|PUT|DELETE /notes/{id} · GET /health</text>
    <line x1="300" y1="562" x2="300" y2="582" stroke="#2B3A55" stroke-width="1.6" marker-end="url(#arr)"/>

    <rect x="100" y="584" width="400" height="52" rx="8" fill="#FFF6EC" stroke="#B5651D"/>
    <text x="300" y="606" font-size="14" font-weight="600" fill="#7A3F0C" text-anchor="middle">Lambda (nodejs20.x)</text>
    <text x="300" y="624" font-size="12" fill="#7A3F0C" text-anchor="middle">createNote · getNote · updateNote · deleteNote · health</text>
    <line x1="300" y1="636" x2="300" y2="656" stroke="#2B3A55" stroke-width="1.6" marker-end="url(#arr)"/>
    <text x="312" y="651" font-size="11" fill="#56627A">IAM: local replica ARN only</text>

    <rect x="100" y="658" width="400" height="64" rx="8" fill="#EAF6F0" stroke="#1F7A5A" stroke-width="1.6"/>
    <text x="300" y="682" font-size="14" font-weight="600" fill="#124A37" text-anchor="middle">DynamoDB replica · notes-dr-notes</text>
    <text x="300" y="700" font-size="12" fill="#124A37" text-anchor="middle">Streams NEW_AND_OLD_IMAGES · PITR on</text>
    <text x="300" y="715" font-size="12" fill="#124A37" text-anchor="middle">Terraform owner of the global table</text>

    <rect x="100" y="736" width="400" height="36" rx="8" fill="#FFFFFF" stroke="#8A94A8"/>
    <text x="300" y="759" font-size="12" fill="#1B2436" text-anchor="middle">CloudWatch alarm: ReplicationLatency → us-east-2</text>
  </g>

  <!-- Region B stack -->
  <g>
    <rect x="700" y="430" width="400" height="58" rx="8" fill="#FFFFFF" stroke="#8A94A8"/>
    <text x="900" y="453" font-size="14" font-weight="600" fill="#1B2436" text-anchor="middle">Custom domain api.example.com (REGIONAL)</text>
    <text x="900" y="473" font-size="12" fill="#56627A" text-anchor="middle">ACM cert issued in us-east-2 · base path mapping → stage dev</text>
    <line x1="900" y1="488" x2="900" y2="508" stroke="#2B3A55" stroke-width="1.6" marker-end="url(#arr)"/>

    <rect x="700" y="510" width="400" height="52" rx="8" fill="#FFF6EC" stroke="#B5651D"/>
    <text x="900" y="532" font-size="14" font-weight="600" fill="#7A3F0C" text-anchor="middle">API Gateway REST API (REGIONAL endpoint)</text>
    <text x="900" y="550" font-size="12" fill="#7A3F0C" text-anchor="middle">POST /notes · GET|PUT|DELETE /notes/{id} · GET /health</text>
    <line x1="900" y1="562" x2="900" y2="582" stroke="#2B3A55" stroke-width="1.6" marker-end="url(#arr)"/>

    <rect x="700" y="584" width="400" height="52" rx="8" fill="#FFF6EC" stroke="#B5651D"/>
    <text x="900" y="606" font-size="14" font-weight="600" fill="#7A3F0C" text-anchor="middle">Lambda (nodejs20.x) — same zip</text>
    <text x="900" y="624" font-size="12" fill="#7A3F0C" text-anchor="middle">createNote · getNote · updateNote · deleteNote · health</text>
    <line x1="900" y1="636" x2="900" y2="656" stroke="#2B3A55" stroke-width="1.6" marker-end="url(#arr)"/>
    <text x="912" y="651" font-size="11" fill="#56627A">IAM: local replica ARN only</text>

    <rect x="700" y="658" width="400" height="64" rx="8" fill="#EAF6F0" stroke="#1F7A5A" stroke-width="1.6"/>
    <text x="900" y="682" font-size="14" font-weight="600" fill="#124A37" text-anchor="middle">DynamoDB replica · notes-dr-notes</text>
    <text x="900" y="700" font-size="12" fill="#124A37" text-anchor="middle">Streams NEW_AND_OLD_IMAGES · PITR on</text>
    <text x="900" y="715" font-size="12" fill="#124A37" text-anchor="middle">Created via replica { } block</text>

    <rect x="700" y="736" width="400" height="36" rx="8" fill="#FFFFFF" stroke="#8A94A8"/>
    <text x="900" y="759" font-size="12" fill="#1B2436" text-anchor="middle">CloudWatch alarm: ReplicationLatency → us-east-1</text>
  </g>

  <!-- Replication arrow -->
  <line x1="502" y1="690" x2="698" y2="690" stroke="#1F7A5A" stroke-width="2.5" marker-start="url(#arrG)" marker-end="url(#arrG)"/>
  <rect x="548" y="620" width="104" height="58" rx="6" fill="#FFFFFF" stroke="#1F7A5A"/>
  <text x="600" y="638" font-size="12" font-weight="700" fill="#124A37" text-anchor="middle">Global table</text>
  <text x="600" y="654" font-size="11" fill="#124A37" text-anchor="middle">async, ~1 s</text>
  <text x="600" y="669" font-size="11" fill="#124A37" text-anchor="middle">last writer wins</text>

  <!-- Pipeline -->
  <rect x="330" y="812" width="540" height="62" rx="10" fill="#EEF2F8" stroke="#2B3A55" stroke-width="1.5"/>
  <text x="600" y="836" font-size="15" font-weight="700" fill="#1B2436" text-anchor="middle">CI/CD pipeline (GitHub Actions + Terraform)</text>
  <text x="600" y="857" font-size="12" fill="#56627A" text-anchor="middle">one apply → both regions · write in A, read in B · monthly drill</text>
  <path d="M330,843 L40,843 L40,580 L58,580" fill="none" stroke="#2B3A55" stroke-width="1.4" stroke-dasharray="5 4" marker-end="url(#arr)"/>
  <path d="M870,843 L1165,843 L1165,580 L1142,580" fill="none" stroke="#2B3A55" stroke-width="1.4" stroke-dasharray="5 4" marker-end="url(#arr)"/>
</svg>
