name: dr-drill

# Monthly non-disruptive DR drill. The report is kept as audit evidence.
on:
  schedule:
    - cron: "0 6 1 * *"
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

concurrency:
  group: terraform-state
  cancel-in-progress: false

jobs:
  drill:
    if: vars.AWS_ROLE_ARN != ''
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
          role-duration-seconds: 7200
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.10.5"
          terraform_wrapper: false
      - name: Init (read outputs only)
        run: >
          terraform init -input=false
          -backend-config="bucket=${{ vars.TF_STATE_BUCKET }}"
          -backend-config="key=aws-drs-terraform/terraform.tfstate"
          -backend-config="region=${{ vars.AWS_REGION }}"
          -backend-config="use_lockfile=true"
      - name: Run drill
        run: ./scripts/drill-test.sh --report-dir reports
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dr-drill-report
          path: reports/
          retention-days: 400
