name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  terraform:
    name: Terraform fmt / validate / test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "~1.10"
      - name: fmt
        run: terraform fmt -check -recursive -diff
      - name: init (no backend)
        run: terraform init -backend=false -input=false
      - name: validate
        run: terraform validate
      - name: test (mocked providers, no AWS credentials)
        run: terraform test
      - name: validate bootstrap stack
        run: |
          terraform -chdir=bootstrap init -backend=false -input=false
          terraform -chdir=bootstrap validate

  tflint:
    name: TFLint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: terraform-linters/setup-tflint@v4
      - name: init plugins
        run: tflint --init
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - name: lint
        run: tflint --recursive --format compact

  checkov:
    name: Checkov security scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4
      - uses: bridgecrewio/checkov-action@v12
        with:
          directory: .
          config_file: .checkov.yaml
          output_format: cli,sarif
          output_file_path: console,results.sarif
      - name: upload SARIF to GitHub code scanning
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: results.sarif

  python:
    name: Python unit tests (app + failover Lambda)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: compile
        run: python -m py_compile app/app.py lambda/failover/handler.py
      - name: unit tests
        run: python -m unittest discover -s tests/python -v

  shell:
    name: ShellCheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: shellcheck
        run: shellcheck scripts/*.sh
